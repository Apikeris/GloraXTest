# Render Free: web and worker subprocesses share the free service lifecycle.
# Existing services: set Start Command manually; YAML does not update them automatically.
services:
  - type: web
    name: glorax-knowledge-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Keep scraping out of this free web instance: the worker can starve HTTP
    # health checks while a long refresh is running.
    # HEAD / is database-free; bounded DB timeouts and gthread keep health checks
    # responsive when Aiven stalls. The launcher applies migrations first and
    # supervises the durable scraper queue only after HTTP is listening.
    startCommand: python scripts/start_render.py
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/secrets/aiven-ca.pem
      - key: TRUST_PROXY
        value: '1'
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '0'
