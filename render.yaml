# Render Free: web and worker subprocesses share the free service lifecycle.
# Existing services: set Start Command manually; YAML does not update them automatically.
services:
  - type: web
    name: glorax-knowledge-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Keep scraping out of this free web instance: the worker can starve HTTP
    # health checks while a long refresh is running.
    # Preload the Flask app before Gunicorn binds the public port. Without
    # preload, Render can probe the listening master while its only worker is
    # still importing the app and incorrectly time out its 5-second healthcheck.
    startCommand: exec gunicorn app:app --preload --worker-class sync --bind 0.0.0.0:$PORT --workers 1 --timeout 60 --graceful-timeout 10 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/secrets/aiven-ca.pem
      - key: TRUST_PROXY
        value: '1'
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '0'
