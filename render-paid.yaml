services:
  - type: web
    name: glorax-knowledge-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python scripts/migrate.py
    startCommand: gunicorn 'app:app' --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/secrets/aiven-ca.pem
      - key: TRUST_PROXY
        value: '1'
      - key: DB_POOL_SIZE
        value: '3'
      - key: DB_MAX_OVERFLOW
        value: '1'
  - type: worker
    name: glorax-knowledge-worker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m glorax.worker
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLROOTCERT
        value: /etc/secrets/aiven-ca.pem
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '0'
