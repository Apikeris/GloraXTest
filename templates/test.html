{% extends 'base.html' %}{% block content %}<section class="quiz" data-attempt-id="{{ attempt.id }}" id="quiz"><div class="eyebrow">{{ attempt.project_name }}</div><div class="card"><div class="section-head"><strong id="progress-text">Подготовка вопроса…</strong><span class="timer" id="timer" aria-live="off">20 с</span></div><progress id="progress" max="{{ attempt.total }}" value="0"></progress><h1 id="question-text" class="question">Загрузка…</h1><div id="options" class="options"></div><p id="connection-status" role="status">Ожидаем ответ сервера</p><button class="btn secondary" id="retry" hidden>Повторить загрузку</button></div><p class="muted">Ответ принимается одним нажатием. Вернуться к предыдущему вопросу нельзя. Обновление страницы не продлевает время.</p></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static',filename='test.js') }}" defer></script>{% endblock %}
