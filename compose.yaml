services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: glorax
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: glorax
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - glorax_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U glorax']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  glorax_pg:
